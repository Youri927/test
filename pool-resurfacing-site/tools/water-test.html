<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script src="../src/water.js"></script>
<script>
// Banc d'essai du rendu de l'eau : ?a=worn&b=stripped&level=0.5&wipe=0.4&t=3&drops=1
const q = new URLSearchParams(location.search);
const names = [q.get('a') || 'fin-quartz', q.get('b')].filter(Boolean);
const load = (n) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = '../src/img/' + n + '.webp'; });
Promise.all(names.map(load)).then((imgs) => {
  const opt = {keep: true, dpr: 1};
  for (const k of ['focus', 'amb', 'sun', 'tile', 'depth', 'blur', 'seed']) if (q.has(k)) opt[k] = +q.get(k);
  const w = new Water(document.getElementById('c'), opt);
  const look = {deep: q.get('deep') || '#0a4a60', trans: (q.get('tr') || '0.24,0.72,0.86').split(',').map(Number)};
  const size = q.has('size') ? +q.get('size') : 1;
  names.forEach((n, i) => w.texture(n, imgs[i], {...look, size}));
  const t = +(q.get('t') || 3);
  w.set({a: names[0], b: names[1] || null, level: q.has('level') ? +q.get('level') : 1, wipe: q.has('wipe') ? +q.get('wipe') : -1, clear: q.has('clear') ? +q.get('clear') : 1, fillDir: (q.get('dir') || '-0.8,-0.6').split(',').map(Number)});
  if (q.get('drops')) { w.drop(innerWidth * 0.62, innerHeight * 0.45, 1, t - 1.6); w.drop(innerWidth * 0.3, innerHeight * 0.7, 0.6, t - 0.8); }
  w.render(t);
  document.title = 'ready';
});
</script>
