<title>Respray</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Respray, prototype. Le parfum de seconde main, sans le doute : des annonces vérifiées par l'équipe avant d'être en ligne, un paiement bloqué, et 7 jours pour vérifier.">
<link rel="icon" href="../marque/favicon.svg">
<link rel="stylesheet" href="styles.css">

<p class="proto" role="note">Prototype · annonces et vendeurs fictifs, photos en 3D · <a href="#panel">Panel équipe <span class="badge" id="badge-panel">5</span></a> · <a href="#marque">Identité</a></p>
<header class="entete">
  <div class="env entete-in">
    <a class="logo" href="#accueil" aria-label="Respray, accueil"><!--logo--></a>
    <form class="cherche" data-form="entete" role="search">
      <label class="vh" for="q-entete">Rechercher un parfum ou une marque</label>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="q-entete" name="q" type="search" placeholder="Rechercher un parfum ou une marque" autocomplete="off">
    </form>
    <nav class="nav" aria-label="Principale">
      <a href="#recherche" data-nav="recherche">Parfums</a>
      <a href="#fonctionnement" data-nav="fonctionnement">Comment ça marche</a>
      <a class="btn btn-noir btn-petit" href="#vendre" data-nav="vendre">Vendre</a>
    </nav>
    <button class="theme" type="button" data-action="theme" aria-pressed="false" aria-label="Passer en sombre" title="Passer en sombre">
      <svg class="ico ico-lune" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="ico ico-soleil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="vue"></main>

<footer class="pied">
  <div class="env pied-in">
    <div>
      <a class="logo" href="#accueil" aria-label="Respray, accueil"><!--logo--></a>
      <p>Achetez et revendez vos parfums entre particuliers.</p>
    </div>
    <nav aria-label="Respray">
      <a href="#recherche">Parfums</a>
      <a href="#vendre">Vendre</a>
      <a href="#fonctionnement">Comment ça marche</a>
      <a href="#marque">Identité</a>
    </nav>
  </div>
</footer>

<template id="tpl-logo"><!--logo--></template>
<div id="modale" hidden></div>
<p id="message" class="message" role="status" hidden></p>
