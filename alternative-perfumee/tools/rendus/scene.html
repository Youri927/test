<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Caveat; src: url(../../vendor/fonts/caveat-500.woff2); }
  @font-face { font-family: Inter; src: url(../../vendor/fonts/inter-400-700.woff2); font-weight: 400 700; }
  body { margin: 0; background: #888; }
</style>
<script src="../../src/atelier3d.js"></script>
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* Studio : fond gris très clair, lumière d'une pièce blanche (reflets doux), ombre de contact sous les objets. Les
   flacons, les matières et la lumière viennent de l'atelier partagé avec le site (src/atelier3d.js). */
const FOND = 0xf2f2f4;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const {env, toile, ombre, flacon, dessous, largeur, profondeur, FORMES} = creerAtelier(THREE, {RoomEnvironment, RoundedBoxGeometry}, renderer);

function papier(texte1, texte2) {
  const tex = toile(700, 480, (g, w, h) => {
    g.fillStyle = '#fdfcf8';
    g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(120,150,200,.25)';
    g.lineWidth = 2;
    for (let y = 70; y < h; y += 58) {
      g.beginPath();
      g.moveTo(0, y);
      g.lineTo(w, y);
      g.stroke();
    }
    g.fillStyle = '#1f2a5a';
    g.font = '500 96px Caveat';
    g.fillText(texte1, 48, 168);
    g.fillText(texte2, 48, 344);
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(5.6, 3.84), new THREE.MeshStandardMaterial({map: tex, roughness: 0.9}));
}
function boite(lot) {
  const face = toile(560, 1000, (g, w, h) => {
    g.fillStyle = '#fbfbf9';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#1d1d1f';
    g.fillRect(140, 300, w - 280, 10);
    g.globalAlpha = .5;
    g.fillRect(190, 340, w - 380, 6);
    g.globalAlpha = 1;
  });
  const cote = toile(400, 1000, (g, w, h) => {
    g.fillStyle = '#f4f4f2';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#1d1d1f';
    g.font = '600 34px Inter';
    g.fillText(lot, 46, h - 210);
    const barres = [0, 3, 5, 9, 11, 14, 17, 19, 22, 25, 27, 30, 33, 35, 38];
    barres.forEach((k) => g.fillRect(46 + k * 8, h - 170, k % 3 ? 4 : 8, 110));
  });
  const blanc = new THREE.MeshStandardMaterial({color: 0xf7f7f5, roughness: 0.85});
  const mats = [new THREE.MeshStandardMaterial({map: cote, roughness: 0.85}), blanc, blanc, blanc, new THREE.MeshStandardMaterial({map: face, roughness: 0.85}), blanc];
  const m = new THREE.Mesh(new THREE.BoxGeometry(5.6, 10, 4), mats);
  m.position.y = 5;
  return m;
}
function ticket(nom) {
  const tex = toile(420, 1000, (g, w, h) => {
    g.fillStyle = '#fefefb';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#333';
    g.font = '600 34px Inter';
    g.fillText('PARFUMERIE', 40, 90);
    g.font = '500 26px Inter';
    g.globalAlpha = .75;
    [['22/03/2023', 150], [nom.slice(0, 22), 260], ['1 x', 300], ['TOTAL', 420], ['CB', 470]].forEach(([t, y]) => g.fillText(t, 40, y));
    g.globalAlpha = .35;
    for (let y = 560; y < 900; y += 44) g.fillRect(40, y, 200 + ((y * 7) % 120), 6);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 10), new THREE.MeshStandardMaterial({map: tex, roughness: 0.95, side: THREE.DoubleSide}));
  return m;
}
/* le rendu d'une vue ; renvoie l'image (webp), et pour la porte « Vendre » la position de la buse dans l'image */
window.rendre = async (o) => {
  await document.fonts.load('96px Caveat');
  await document.fonts.load('600 34px Inter');
  const W = o.w || 600;
  const H = o.h || 750;
  renderer.setSize(W, H);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(o.fond || FOND);
  scene.environment = env;
  const cam = new THREE.PerspectiveCamera(22, W / H, 0.1, 200);
  let resultat = {};
  const vue = o.vue;
  if (vue === 'face' || vue === 'preuve') {
    const fl = flacon({...o, bouchonMis: true});
    const f = fl.userData.f;
    fl.rotation.y = f.type === 'galet' || f.type === 'cyl' ? 0 : -0.32;
    scene.add(fl);
    scene.add(ombre(largeur(f) * 1.9, profondeur(f) * 2.4, 0, 0, 0.9));
    let haut = fl.userData.haut;
    let cx = 0;
    if (vue === 'preuve') {
      fl.position.x = -2.2;
      scene.children[scene.children.length - 1].position.x = -2.2;
      const p = papier('@' + o.pseudo, '24/11/2026');
      p.position.set(3.6, 1.9, 1.6);
      p.rotation.set(-0.12, -0.32, 0.03);
      scene.add(p);
      scene.add(ombre(6.4, 2.4, 3.6, 2.1, 0.5));
      cx = 0.4;
      haut = Math.max(haut, 4);
    }
    const ty = haut * 0.47;
    const fitH = haut * (vue === 'preuve' ? 1.55 : 1.42);
    const dist = fitH / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(cx, ty + dist * 0.09, dist);
    cam.lookAt(cx, ty, 0);
  } else if (vue === 'niveau') {
    // gros plan sur la surface du jus, vue de face ; la caméra vise ce point, qui tombe donc au milieu de l'image
    const fl = flacon({...o, bouchonMis: true});
    const f = fl.userData.f;
    fl.rotation.y = f.type === 'galet' || f.type === 'cyl' ? 0 : -0.32;
    scene.add(fl);
    scene.add(ombre(largeur(f) * 1.9, profondeur(f) * 2.4, 0, 0, 0.9));
    fl.updateMatrixWorld(true);
    const cible = fl.localToWorld(new THREE.Vector3(0, fl.userData.niveauY, profondeur(f) / 2));
    const fitH = fl.userData.haut * 0.7;
    const dist = fitH / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(cible.x, cible.y + dist * 0.04, cible.z + dist);
    cam.lookAt(cible);
  } else if (vue === 'contrejour') {
    // un flacon opaque, dans une pièce peu éclairée, la lampe d'un téléphone collée derrière : la lumière traverse le
    // verre, le parfum fait une zone plus sombre et plus chaude, et la limite du niveau se voit
    scene.environmentIntensity = 0.32;
    const fl = flacon({...o, bouchonMis: true});
    const f = fl.userData.f;
    fl.rotation.y = -0.18;
    const W = largeur(f);
    const D = profondeur(f);
    const frac = fl.userData.niveauY / f.h;
    fl.children[1].visible = false;
    const lum = toile(512, 1024, (g, w, h) => {
      const yN = h * (1 - frac);
      g.fillStyle = '#f3e3c8';
      g.fillRect(0, 0, w, yN);
      g.fillStyle = '#7a3f12';
      g.fillRect(0, yN, w, h - yN);
      // une ligne un peu plus claire à la surface, comme un ménisque
      g.fillStyle = 'rgba(255,214,160,.8)';
      g.fillRect(0, yN - 3, w, 5);
      // la lampe éclaire surtout au centre ; les bords restent sombres
      // (une ellipse sombre par-dessus, à l'échelle de la face : le centre brille, les bords s'éteignent ; la carte
      // d'émission ne lit pas la transparence, on assombrit donc la couleur elle-même)
      g.translate(w / 2, h / 2);
      g.scale(1, h / w);
      const r = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.62);
      r.addColorStop(0, 'rgba(0,0,0,0)');
      r.addColorStop(0.35, 'rgba(0,0,0,.25)');
      r.addColorStop(0.7, 'rgba(0,0,0,.8)');
      r.addColorStop(1, 'rgba(0,0,0,1)');
      g.fillStyle = r;
      g.fillRect(-w / 2, -w / 2, w, w);
    });
    fl.children[0].material = new THREE.MeshPhysicalMaterial({color: 0x101013, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.06, emissive: 0xffffff, emissiveMap: lum, emissiveIntensity: 0.75, envMapIntensity: 1.6});
    scene.add(fl);
    scene.add(ombre(W * 1.9, D * 2.4, 0, 0, 0.9));
    // le téléphone, debout derrière, qui dépasse du flacon
    const tel = new THREE.Mesh(new RoundedBoxGeometry(7.2, 15, 0.78, 4, 0.95), new THREE.MeshPhysicalMaterial({color: 0x26262a, roughness: 0.35, metalness: 0.2, clearcoat: 0.8, envMapIntensity: 1.4}));
    tel.position.set(0.9, 7.5, -D / 2 - 0.5);
    tel.rotation.z = 0.05;
    scene.add(tel);
    // le halo de la lampe, qui déborde autour du flacon
    const halo = toile(256, 256, (g, w) => {
      const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      r.addColorStop(0, 'rgba(255,236,205,.95)');
      r.addColorStop(0.35, 'rgba(255,214,160,.35)');
      r.addColorStop(1, 'rgba(255,214,160,0)');
      g.fillStyle = r;
      g.fillRect(0, 0, w, w);
    });
    const h = new THREE.Mesh(new THREE.PlaneGeometry(W * 2.2, W * 2.2), new THREE.MeshBasicMaterial({map: halo, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
    h.position.set(0, f.h * 0.5, -D / 2 - 0.08);
    scene.add(h);
    const haut = fl.userData.haut;
    const ty = haut * 0.5;
    const fitH = haut * 1.42;
    const dist = fitH / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(0, ty + dist * 0.06, dist);
    cam.lookAt(0, ty, 0);
  } else if (vue === 'dessus' || vue === 'tige') {
    const fl = flacon({...o, bouchonMis: false, bouton: vue === 'dessus', tige: vue === 'tige'});
    const f = fl.userData.f;
    scene.add(fl);
    scene.add(ombre(largeur(f) * 1.9, profondeur(f) * 2.4, 0, 0, 0.9));
    // tout le haut du flacon dans le cadre, avec un peu de sa face avant : comme une photo prise debout, penché au-dessus
    const yTop = f.h + 1.1;
    const fit = Math.max(4.6, Math.max(largeur(f), profondeur(f)) * 1.55);
    const dist = fit / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(0, yTop + dist * 0.9, dist * 0.42);
    cam.lookAt(0, yTop - 0.7, 0);
  } else if (vue === 'vendre') {
    // le flacon sans bouchon, sur le fond de la porte « Vendre » ; on renvoie la position de la buse pour y poser la brume
    const fl = flacon({...o, bouchonMis: false, bouton: true});
    const f = fl.userData.f;
    fl.rotation.y = -0.22;
    scene.add(fl);
    scene.add(ombre(largeur(f) * 1.9, profondeur(f) * 2.4, 0, 0, 0.9));
    const haut = fl.userData.haut;
    const fitH = haut * 1.3;
    const dist = fitH / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(0, haut * 0.5 + dist * 0.08, dist);
    cam.lookAt(0, haut * 0.5, 0);
    cam.updateMatrixWorld();
    fl.updateMatrixWorld(true);
    const p = new THREE.Vector3();
    fl.userData.buse.getWorldPosition(p);
    p.project(cam);
    resultat.buse = {x: (p.x + 1) / 2, y: (1 - p.y) / 2};
  } else if (vue === 'dessous') {
    const fl = flacon({...o, bouchonMis: true});
    const f = fl.userData.f;
    scene.add(fl);
    scene.add(dessous(f, o.lot, o.ml));
    const fit = Math.max(largeur(f), profondeur(f)) * 1.25;
    const dist = fit / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.up.set(0, 0, -1);
    cam.position.set(0, -dist, 0.001);
    cam.lookAt(0, 0, 0);
  } else if (vue === 'boite') {
    const b = boite(o.lot);
    b.rotation.y = -0.5;
    scene.add(b);
    scene.add(ombre(9, 7, 0, 0, 0.7));
    const dist = 14 / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(0, 5 + dist * 0.12, dist);
    cam.lookAt(0, 4.8, 0);
  } else if (vue === 'ticket') {
    const t = ticket(o.nom || '');
    t.rotation.x = -Math.PI / 2;
    t.rotation.z = 0.08;
    t.position.y = 0.01;
    scene.add(t);
    const dist = 12.5 / 2 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    cam.position.set(0, dist * 0.94, dist * 0.34);
    cam.lookAt(0, 0, 0);
  }
  renderer.render(scene, cam);
  resultat.image = renderer.domElement.toDataURL('image/webp', o.qualite || 0.82);
  scene.traverse((x) => {
    if (x.geometry) x.geometry.dispose();
  });
  return resultat;
};
window.pret = true;
</script>
