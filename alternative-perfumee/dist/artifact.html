:root {
  --fond: #ffffff;
  --fond-2: #f5f5f7;
  --texte: #1d1d1f;
  --texte-2: #6e6e73;
  --trait: #d2d2d7;
  --noir: #1d1d1f;
  --sur-noir: #ffffff;
  --vert: #1a7f4b;
  --vert-fond: #e9f5ee;
  --rouge: #b3261e;
  --police: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --rayon: 12px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --panneau: #1d1d1f;
  --sur-panneau: #f5f5f7;
  interpolate-size: allow-keywords;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #000000; --fond-2: #1c1c1e; --texte: #f5f5f7; --texte-2: #a1a1a6; --trait: #38383a;
    --noir: #f5f5f7; --sur-noir: #1d1d1f; --vert: #4cc38a; --vert-fond: #12261b; --rouge: #ff8a80; --panneau: #2c2c2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #000000; --fond-2: #1c1c1e; --texte: #f5f5f7; --texte-2: #a1a1a6; --trait: #38383a;
  --noir: #f5f5f7; --sur-noir: #1d1d1f; --vert: #4cc38a; --vert-fond: #12261b; --rouge: #ff8a80; --panneau: #2c2c2e;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 400 16px/1.5 var(--police); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fond); }
h1, h2, h3, p, ul, ol, dl, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--texte); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.env { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 22px; border: 1px solid var(--trait); border-radius: 980px; background: var(--fond); color: var(--texte); font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--texte-2); }
.btn { transition: transform .2s var(--ease), opacity .2s, border-color .2s, background .2s; }
.btn:active { transform: scale(.97); }
.btn-noir { background: var(--noir); border-color: var(--noir); color: var(--sur-noir); }
.btn-noir:hover { opacity: .88; border-color: var(--noir); }
.btn-petit { min-height: 38px; padding: 7px 16px; font-size: 14px; }
.btn-large { min-height: 50px; font-size: 16px; }
.lien { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; text-decoration: none; }
.lien .ico { width: 16px; height: 16px; }
.lien:hover { text-decoration: underline; }
.champ { width: 100%; min-height: 46px; padding: 10px 14px; border: 1px solid var(--trait); border-radius: 12px; background: var(--fond); }
select.champ { padding-right: 10px; }
.aide { color: var(--texte-2); font-size: 14px; }
input[type="radio"], input[type="checkbox"], input[type="range"] { accent-color: var(--noir); }

/* en-tête */
.proto a { color: inherit; font-weight: 600; text-decoration: none; }
.proto a:hover { color: var(--texte); }
.proto .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: #e0245e; color: #fff; font-size: 11px; font-weight: 700; }
.proto { padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--fond-2); color: var(--texte-2); font-size: 12.5px; text-align: center; }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fond); border-bottom: 1px solid var(--trait); }
.entete-in { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.logo { display: inline-flex; align-items: center; color: var(--texte); text-decoration: none; }
.logo-svg { display: block; height: 25px; width: auto; }
.pied .logo-svg { height: 22px; }
.cherche { position: relative; flex: 1; max-width: 520px; }
.cherche .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--texte-2); width: 18px; height: 18px; }
.cherche input { width: 100%; height: 40px; padding: 0 14px 0 40px; border: 0; border-radius: 980px; background: var(--fond-2); }
.nav { display: flex; align-items: center; gap: 22px; margin-left: auto; font-weight: 500; font-size: 15px; white-space: nowrap; }
.nav a:not(.btn) { text-decoration: none; }
.nav a:not(.btn):hover, .nav a[aria-current="page"]:not(.btn) { text-decoration: underline; text-underline-offset: 6px; }

/* accueil */
.chapo { margin-top: 16px; font-size: 18px; color: var(--texte-2); max-width: 52ch; }
.cherche-grand { display: flex; align-items: center; gap: 10px; margin-top: 28px; padding: 6px 6px 6px 16px; border: 1px solid var(--trait); border-radius: 12px; max-width: 540px; }
.cherche-grand .ico { color: var(--texte-2); }
.cherche-grand input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; outline: none; font-size: 16px; }

.section { padding-top: 56px; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.section-tete h2, .h2 { font-weight: 650; font-size: 22px; letter-spacing: -.015em; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { padding: 9px 16px; border: 1px solid var(--trait); border-radius: 99px; font-size: 14.5px; font-weight: 500; text-decoration: none; }
.puce:hover { border-color: var(--texte-2); }
.deux { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.etapes-bloc { padding: 24px; border-radius: var(--rayon); background: var(--fond-2); }
.etapes-bloc h3 { font-size: 17px; font-weight: 650; margin-bottom: 14px; }
.etapes { counter-reset: e; display: grid; gap: 14px; }
.etapes li { counter-increment: e; position: relative; padding-left: 38px; color: var(--texte-2); font-size: 15px; }
.etapes li::before { content: counter(e); position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--fond); color: var(--texte); font-weight: 700; font-size: 13px; }
.etapes strong { color: var(--texte); font-weight: 600; }
.bandeau-vendre { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; padding: 28px; border: 1px solid var(--trait); border-radius: var(--rayon); margin-bottom: 64px; }
.bandeau-vendre h2 { font-size: 22px; font-weight: 650; }
.bandeau-vendre p { color: var(--texte-2); }

/* cartes */
.grille { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 18px; }
.grille-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.carte { position: relative; }
.carte-lien { display: grid; gap: 2px; text-decoration: none; }
.carte-photo { position: relative; margin-bottom: 10px; border-radius: var(--rayon); overflow: hidden; }
.visuel { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; }
.carte-photo .visuel { transition: transform .7s var(--ease), filter .4s; }
.carte-lien:hover .carte-photo .visuel { transform: scale(1.035); filter: brightness(.98); }
.etiq { position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 7px; background: rgba(255, 255, 255, .92); color: #161616; font-size: 12.5px; font-weight: 600; }
.carte-prix { font-weight: 700; font-size: 16px; }
.carte-nom { font-weight: 500; font-size: 15px; }
.carte-maison, .carte-meta { color: var(--texte-2); font-size: 13.5px; }
.coeur { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .92); color: #161616; cursor: pointer; }
.coeur svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.coeur[aria-pressed="true"] svg { fill: #e0245e; stroke: #e0245e; }
/* les textes dans les dessins */
.d-code { font: 600 19px var(--police); letter-spacing: .14em; fill: #1d1d1f; }
.d-petit { font: 500 11px var(--police); letter-spacing: .06em; fill: #6e6e73; }
.d-mesure { font: 600 10px var(--police); fill: #ffffff; }
.d-note { font: 500 15px var(--police); fill: #1d1d1f; }
.trait-clair [stroke] { stroke: var(--sur-panneau); }
.trait-clair [fill="#ffffff"] { fill: rgba(255, 255, 255, .06); }

/* pages */
.page { padding-block: 32px 72px; }
.titre-page { font-weight: 650; font-size: clamp(1.7rem, 3vw, 2.2rem); letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; }
.fil { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; font-size: 14px; color: var(--texte-2); }
.fil a { text-decoration: none; }
.fil a:hover { text-decoration: underline; }

/* recherche */
.recherche { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; margin-top: 24px; }
.filtres summary { font-weight: 650; font-size: 17px; cursor: pointer; list-style: none; margin-bottom: 14px; }
.filtres summary::-webkit-details-marker { display: none; }
.filtres form { display: grid; gap: 20px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-weight: 600; font-size: 14.5px; }
.choix { display: flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; }
.resultats-tete { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; color: var(--texte-2); font-size: 15px; }
.tri { display: flex; align-items: center; gap: 10px; }
.tri .champ { width: auto; min-height: 40px; }
.vide { display: grid; justify-items: center; gap: 12px; padding: 48px 20px; border-radius: var(--rayon); background: var(--fond-2); color: var(--texte-2); text-align: center; }

/* annonce */
.annonce { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 48px; align-items: start; }
.galerie { display: grid; gap: 10px; position: sticky; top: 90px; }
.galerie-grande { border-radius: var(--rayon); overflow: hidden; }
.galerie-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
.mini { padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: none; cursor: pointer; }
.mini[aria-pressed="true"] { border-color: var(--texte); }
.fiche { display: grid; gap: 6px; }
.fiche-maison { font-size: 15px; color: var(--texte-2); }
.fiche-maison a { text-decoration: none; }
.fiche h1 { font-weight: 650; font-size: 30px; letter-spacing: -.025em; line-height: 1.15; }
.fiche-sous { color: var(--texte-2); }
.fiche-prix { margin-top: 12px; font-weight: 700; font-size: 30px; letter-spacing: -.02em; }
.fiche-ml { color: var(--texte-2); font-size: 14.5px; }
.details { display: grid; margin-top: 18px; border-top: 1px solid var(--trait); }
.details div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--trait); font-size: 15px; }
.details dt { color: var(--texte-2); }
.details dd { margin: 0; text-align: right; font-weight: 500; }
.livraison { margin-top: 18px; gap: 8px; }
.option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--trait); border-radius: 10px; cursor: pointer; font-size: 15px; }
.option:has(input:checked) { border-color: var(--texte); }
.option input { margin-top: 4px; }
.option small { display: block; color: var(--texte-2); font-size: 13.5px; }
.option > span:last-child { font-weight: 600; }
.total { display: grid; margin-top: 16px; font-size: 15px; }
.total div { display: flex; justify-content: space-between; padding: 4px 0; }
.total dt { color: var(--texte-2); }
.total dd { margin: 0; }
.total-ligne { margin-top: 6px; padding-top: 10px !important; border-top: 1px solid var(--trait); font-weight: 700; font-size: 17px; }
.total-ligne dt { color: var(--texte) !important; }
.boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.boutons .btn { flex: 1 1 180px; }
.protection { margin-top: 16px; padding: 16px 18px; border-radius: var(--rayon); background: var(--vert-fond); }
.protection h2 { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 650; color: var(--vert); margin-bottom: 4px; }
.protection p { font-size: 14.5px; }
.vendeur { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 0; border-top: 1px solid var(--trait); text-decoration: none; }
.vendeur small { display: block; color: var(--texte-2); font-size: 13.5px; }
.avatar { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--fond-2); font-weight: 700; font-size: 18px; flex: none; }
.annonce-bas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; margin-top: 48px; }
.annonce-bas p { margin-top: 10px; color: var(--texte-2); }
.verifiee .h2 { display: flex; align-items: center; gap: 8px; }
.verifiee .h2 .ico { color: var(--vert); stroke-width: 2.4; }
.verifiee ul, .liste-check { display: grid; gap: 8px; margin-top: 12px; }
.verifiee li, .liste-check li { position: relative; padding-left: 26px; color: var(--texte-2); font-size: 15px; }
.verifiee li::before, .liste-check li::before { content: ""; position: absolute; left: 4px; top: .45em; width: 10px; height: 5px; border-left: 2px solid var(--vert); border-bottom: 2px solid var(--vert); transform: rotate(-45deg); }

/* vendre */
.vendre { max-width: 760px; }
.formulaire { display: grid; gap: 8px; margin-top: 28px; }
.bloc-form { display: grid; gap: 10px; padding-block: 24px; border-top: 1px solid var(--trait); }
.bloc-form label:not(.choix):not(.photo) { font-weight: 600; font-size: 15px; }
.ligne-champs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ligne-champs > div { display: grid; gap: 8px; }
.segment { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.segment .choix { padding: 10px 16px; border: 1px solid var(--trait); border-radius: 10px; font-weight: 500; }
.segment .choix:has(input:checked) { border-color: var(--texte); }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.photo { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px dashed var(--trait); border-radius: var(--rayon); cursor: pointer; }
.photo:hover { border-color: var(--texte-2); }
.photo.faite { border-style: solid; border-color: var(--vert); }
.photo-cadre { position: relative; display: grid; place-items: center; width: 60px; aspect-ratio: 4 / 5; flex: none; border-radius: 9px; background: var(--fond-2); color: var(--texte-2); overflow: hidden; }
.photo-cadre .visuel { position: absolute; inset: 0; width: 100%; height: 100%; }
.photo-exemple { position: absolute; inset: 0; opacity: .4; filter: saturate(.4); transition: opacity .3s var(--ease); }
.photo:hover .photo-exemple { opacity: .6; }
.photo-plus { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fond); color: var(--texte); box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.photo-plus .ico { width: 16px; height: 16px; }
.photo-ok { position: absolute; right: 4px; bottom: 4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--vert); color: #fff; animation: pop .4s var(--ease) both; }
.photo-ok .ico { width: 12px; height: 12px; stroke-width: 3; }
.photo-cadre img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-txt strong { display: block; font-size: 15px; font-weight: 600; }
.photo-txt em { font-style: normal; font-weight: 400; color: var(--texte-2); }
.photo-txt small { display: block; color: var(--texte-2); font-size: 13.5px; }
.champ-prix { display: flex; align-items: center; gap: 10px; max-width: 220px; }
.champ-prix .champ { font-size: 18px; font-weight: 600; }
.champ-prix span { font-weight: 600; color: var(--texte-2); }
.erreur { color: var(--rouge); font-weight: 600; }
.formulaire > .btn { margin-top: 8px; justify-self: start; }
.envoye { display: grid; justify-items: start; gap: 14px; padding-top: 24px; }
.rond-ok { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--vert-fond); color: var(--vert); }
.rond-ok .ico { width: 28px; height: 28px; stroke-width: 2.4; }

/* comment ça marche */
.lecture { max-width: 820px; }
.lecture .section { padding-top: 40px; }
.lecture .section > p { margin-top: 10px; color: var(--texte-2); }
.exemples { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.exemples figure { display: grid; gap: 6px; }
.exemples .visuel { border-radius: 10px; }
.exemples figcaption { font-size: 13px; color: var(--texte-2); line-height: 1.35; }
.frise { counter-reset: f; display: grid; gap: 12px; margin-top: 14px; }
.frise li { counter-increment: f; position: relative; padding-left: 40px; color: var(--texte-2); }
.frise li::before { content: counter(f); position: absolute; left: 0; top: -1px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--fond-2); color: var(--texte); font-weight: 700; font-size: 13px; }
.frise strong { color: var(--texte); }
.frais { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 15px; }
.frais th, .frais td { padding: 11px 0; border-bottom: 1px solid var(--trait); text-align: left; font-weight: 400; }
.frais td { text-align: right; font-weight: 600; }
.faq details { border-bottom: 1px solid var(--trait); }
.faq .h2 { margin-bottom: 6px; }
.faq summary { padding: 16px 28px 16px 0; font-weight: 600; cursor: pointer; list-style: none; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 2px; top: 13px; font-size: 22px; font-weight: 400; color: var(--texte-2); }
.faq details[open] summary::after { content: "–"; }
.faq details p { padding-bottom: 16px; color: var(--texte-2); }

/* fenêtres, messages, pied */
#modale { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#modale[hidden] { display: none; }
.modale-fond { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
.modale-boite { position: relative; display: grid; gap: 12px; width: min(440px, 100%); max-height: 90vh; overflow: auto; padding: 26px; border-radius: 16px; background: var(--fond); }
.modale-boite form { display: grid; gap: 10px; }
.modale-boite label { font-weight: 600; }
.modale-x { position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--texte-2); }
.modale-x:hover { background: var(--fond-2); }
.message { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(520px, calc(100vw - 32px)); padding: 12px 18px; border-radius: 10px; background: var(--noir); color: var(--sur-noir); font-size: 14.5px; }
.pied { border-top: 1px solid var(--trait); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pied-in { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 24px; padding-block: 36px; }
.pied-in p { margin-top: 6px; color: var(--texte-2); font-size: 14.5px; }
.pied nav { display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 15px; }
.pied nav a { text-decoration: none; color: var(--texte-2); }
.pied nav a:hover { color: var(--texte); text-decoration: underline; }

@media (max-width: 960px) {
  .annonce, .annonce-bas, .recherche { grid-template-columns: minmax(0, 1fr); }
  .grille, .grille-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .galerie { position: static; }
  .annonce { gap: 28px; }
  .nav a:not(.btn) { display: none; }
  .filtres { padding: 12px 16px; border: 1px solid var(--trait); border-radius: 10px; }
  .filtres summary { display: flex; justify-content: space-between; margin: 0; font-size: 16px; }
  .filtres summary::after { content: "+"; font-weight: 400; color: var(--texte-2); }
  .filtres[open] summary { margin-bottom: 14px; }
  .filtres[open] summary::after { content: "–"; }
}
@media (max-width: 640px) {
  .entete-in { flex-wrap: wrap; gap: 10px 16px; padding-block: 10px; }
  .cherche { order: 3; flex-basis: 100%; max-width: none; }
  .grille, .grille-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .deux, .photos, .ligne-champs { grid-template-columns: minmax(0, 1fr); }
  .exemples { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chapo { font-size: 16.5px; }
  .fiche h1, .fiche-prix { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ——— mouvements communs ——— */
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes fondu { from { opacity: 0; transform: translateY(10px); } }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 14px); } }
.message.entre { animation: toast .45s var(--ease) both; }
[data-revele] { transition: transform .9s var(--ease); }
.js-anime [data-revele]:not(.vu) { transform: translateY(26px); }
.surtitre { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); margin-bottom: 10px; }
.grand-titre { font-weight: 650; font-size: clamp(1.6rem, 3vw, 2.3rem); line-height: 1.12; letter-spacing: -.028em; text-wrap: balance; }
.lien-bouton { padding: 0; border: 0; background: none; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.champ-petit { min-height: 38px; padding: 6px 10px; font-size: 14px; width: auto; max-width: 100%; }
::view-transition-old(root) { animation: vt-sortie .2s ease both; }
::view-transition-new(root) { animation: vt-entree .5s var(--ease) both; }
::view-transition-group(photo-annonce) { animation-duration: .55s; animation-timing-function: var(--ease); }
@keyframes vt-sortie { to { opacity: 0; } }
@keyframes vt-entree { from { opacity: 0; transform: translateY(12px); } }
.entete { view-transition-name: entete; }

/* ——— accueil : les deux portes ———
   Acheter et vendre côte à côte ; celle qu'on survole prend la place de l'autre. */
.portes { padding-block: 20px 0; }
.portes-in { display: flex; gap: 12px; height: clamp(540px, 74vh, 660px); }
.porte { position: relative; flex: 1.15 1 0; min-width: 0; padding: 40px; border-radius: 28px; overflow: hidden; isolation: isolate; text-decoration: none; transition: flex-grow .9s var(--ease); }
.porte-acheter { background: var(--fond-2); }
.porte-vendre { flex-grow: .85; background: var(--panneau); color: var(--sur-panneau); }
.portes-in:has(.porte-vendre:hover) .porte-acheter { flex-grow: .85; }
.portes-in:has(.porte-vendre:hover) .porte-vendre { flex-grow: 1.15; }
.porte-texte { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; justify-items: start; }
.porte-acheter .porte-texte { width: min(430px, 100%); }
.porte-vendre .porte-texte { width: min(360px, 100%); }
.porte h1 { font-weight: 650; font-size: clamp(2rem, 3.5vw, 3.05rem); line-height: 1.04; letter-spacing: -.035em; text-wrap: balance; }
.porte h2 { font-weight: 650; font-size: clamp(1.6rem, 2.5vw, 2.1rem); line-height: 1.08; letter-spacing: -.035em; text-wrap: balance; }
.porte-vendre .surtitre { color: var(--sur-panneau); opacity: .6; }
.porte-vendre p:not(.surtitre) { opacity: .75; }
.porte .cherche-grand { justify-self: stretch; margin-top: 4px; width: 100%; background: var(--fond); border-color: transparent; box-shadow: 0 12px 30px -20px rgba(0, 0, 0, .35); }
.porte .btn .ico { width: 16px; height: 16px; transition: transform .4s var(--ease); }
.porte-vendre:hover .btn .ico { transform: translateX(4px); }
.btn-clair { background: var(--sur-panneau); border-color: var(--sur-panneau); color: #1c1b1a; }
.direct { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: 14.5px; color: var(--texte-2); }
.direct a { text-decoration: none; }
.direct a:hover { color: var(--texte); }
.direct strong { color: var(--texte); font-weight: 600; }
#direct { display: inline-block; }
#direct.change { animation: fondu .5s var(--ease) both; }
.point-vert { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--vert); animation: pouls 2s ease-out infinite; }
@keyframes pouls { 0% { box-shadow: 0 0 0 0 rgba(11, 122, 75, .45); } 70%, 100% { box-shadow: 0 0 0 9px rgba(11, 122, 75, 0); } }
.pile { position: absolute; right: 30px; bottom: -36px; width: 320px; height: 330px; }
.pile-photo { position: absolute; bottom: 0; left: 50%; width: 168px; border-radius: 16px; overflow: hidden; box-shadow: 0 26px 50px -26px rgba(0, 0, 0, .45); transform: translateX(calc(-50% + (var(--i) - 1) * 78px)) rotate(calc((var(--i) - 1) * 8deg)); transform-origin: 50% 110%; transition: transform 1s var(--ease); animation: flotte 7s ease-in-out infinite; animation-delay: calc(var(--i) * -2.3s); }
.pile-photo:nth-child(2) { z-index: 1; bottom: 34px; }
.porte-acheter:hover .pile-photo { transform: translateX(calc(-50% + (var(--i) - 1) * 112px)) rotate(calc((var(--i) - 1) * 12deg)); }
@keyframes flotte { 50% { translate: 0 -9px; } }
.vaporise { position: absolute; right: 6%; bottom: -46px; height: 360px; width: auto; transform-origin: 80% 100%; transition: transform .9s var(--ease); }
.porte-vendre:hover .vaporise { transform: rotate(-4deg) translateY(-6px); }
.brume circle { fill: var(--sur-panneau); opacity: 0; animation: brume 2.8s cubic-bezier(.2, .7, .3, 1) infinite; animation-delay: var(--d); }
@keyframes brume {
  0% { opacity: 0; transform: translate(0, 0); }
  12% { opacity: .95; }
  60% { opacity: .95; transform: translate(var(--dx), var(--dy)); }
  100% { opacity: 0; transform: translate(calc(var(--dx) * 1.12), calc(var(--dy) * 1.12)); }
}

/* ——— accueil : le ruban des annonces ——— */
.ruban-section { display: grid; gap: 18px; padding-top: 80px; }
.ruban-tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.ruban-tete .aide { margin-top: 8px; max-width: 52ch; }
.ruban-fleches { display: flex; gap: 8px; }
.rond { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid var(--trait); border-radius: 50%; background: var(--fond); color: var(--texte); cursor: pointer; transition: border-color .2s, transform .2s var(--ease); }
.rond:hover { border-color: var(--texte-2); }
.rond:active { transform: scale(.92); }
.rond:first-child .ico { transform: rotate(180deg); }
.ruban-filtres { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.ruban-filtres::-webkit-scrollbar { display: none; }
.filtre { flex: none; padding: 8px 15px; border: 1px solid var(--trait); border-radius: 99px; background: var(--fond); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .3s var(--ease), color .3s, border-color .3s; }
.filtre:hover { border-color: var(--texte-2); }
.filtre[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--fond); }
.ruban { display: grid; grid-auto-flow: column; grid-auto-columns: 236px; gap: 16px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; padding-inline: max(16px, calc((100% - 1200px) / 2 + 16px)); scroll-padding-inline: max(16px, calc((100% - 1200px) / 2 + 16px)); padding-block: 4px 10px; scrollbar-width: none; }
.ruban::-webkit-scrollbar { display: none; }
.ruban .carte { scroll-snap-align: start; }
.etiq-verif { left: 10px; right: auto; top: 10px; bottom: auto; display: flex; align-items: center; gap: 4px; color: var(--vert); }
.etiq-verif .ico { width: 13px; height: 13px; stroke-width: 2.6; }

/* ——— accueil : l'annonce décortiquée ——— */
.anatomie { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 64px; align-items: center; padding-top: 104px; }
.anat-points { display: grid; gap: 4px; margin: 26px 0 22px; }
.anat-points button { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; width: 100%; padding: 16px 18px 20px; border: 0; border-radius: 16px; background: none; text-align: left; cursor: pointer; transition: background .45s var(--ease); }
.anat-points button:hover { background: color-mix(in srgb, var(--fond-2) 55%, transparent); }
.anat-points button[aria-selected="true"] { background: var(--fond-2); }
.anat-n { padding-top: 2px; font-weight: 700; font-size: 14px; color: var(--texte-2); }
.anat-txt strong { display: block; font-size: 17px; font-weight: 600; }
.anat-txt small { display: block; max-height: 0; overflow: hidden; opacity: 0; color: var(--texte-2); font-size: 14.5px; transition: max-height .6s var(--ease), opacity .45s, margin .6s var(--ease); }
[aria-selected="true"] .anat-txt small { max-height: 90px; margin-top: 4px; opacity: 1; }
.anat-prog { position: absolute; left: 18px; right: 18px; bottom: 9px; height: 2px; border-radius: 1px; background: var(--trait); overflow: hidden; opacity: 0; transition: opacity .3s; }
.anat-prog::after { content: ""; position: absolute; inset: 0; background: var(--texte); transform: scaleX(0); transform-origin: left; }
.auto [aria-selected="true"] .anat-prog { opacity: 1; }
.auto [aria-selected="true"] .anat-prog::after { animation: progression 4.2s linear both; }
@keyframes progression { to { transform: scaleX(1); } }
.anat-carte { display: grid; gap: 10px; padding: 16px; border-radius: 28px; background: var(--fond); box-shadow: 0 0 0 1px var(--trait), 0 40px 80px -50px rgba(0, 0, 0, .4); }
.anat-carte .z, .anat-infos { border-radius: 14px; transition: opacity .6s var(--ease), transform .8s var(--ease), box-shadow .6s var(--ease); }
.anat-carte .z { opacity: .3; }
.anat-infos { padding: 2px 8px; opacity: .55; }
.anat-carte[data-zone="0"] .z0, .anat-carte[data-zone="1"] .z1, .anat-carte[data-zone="2"] .z2, .anat-carte[data-zone="3"] .z3 { opacity: 1; transform: scale(1.018); box-shadow: 0 0 0 2px var(--texte), 0 18px 40px -24px rgba(0, 0, 0, .35); }
.z0 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 6px; }
.anat-grande { grid-column: span 2; grid-row: span 2; border-radius: 12px; overflow: hidden; }
.anat-minis { display: contents; }
.anat-minis span { border-radius: 9px; overflow: hidden; }
.anat-minis span:first-child { display: none; }
.anat-carte .visuel { aspect-ratio: 1; }
.anat-infos p { font-size: 14px; color: var(--texte-2); }
.anat-infos .anat-nom { font-size: 19px; font-weight: 650; color: var(--texte); }
.anat-prix { font-size: 18px; font-weight: 700; color: var(--texte) !important; }
.anat-prix small { font-size: 14px; font-weight: 400; color: var(--texte-2); }
.z1, .z2, .z3 { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--fond-2); }
.z1 b, .z2 b, .z3 b { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--noir); color: var(--sur-noir); }
.z1 b { background: var(--vert); color: #fff; }
.z1 b .ico, .z2 b .ico, .z3 b .ico { width: 18px; height: 18px; }
.z1 span, .z2 span, .z3 span { display: grid; gap: 2px; }
.z1 strong, .z2 strong, .z3 strong { font-size: 15px; }
.z1 small, .z3 small { color: var(--texte-2); font-size: 13.5px; }
.anat-jours { display: flex !important; gap: 4px; margin-top: 4px; }
.anat-jours i { width: 22px; height: 6px; border-radius: 3px; background: var(--vert); }
.anat-carte[data-zone="2"] .anat-jours i { animation: jour .45s var(--ease) both; animation-delay: calc(var(--i) * 110ms + 200ms); }

/* ——— accueil : vérifier à la réception ——— */
.reception-section { margin-top: 104px; padding-block: 80px; background: var(--fond-2); }
.reception { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 56px; align-items: start; }
.rec-gauche { position: sticky; top: 100px; display: grid; gap: 20px; }
.rec-progres { display: flex; align-items: center; gap: 14px; }
.rec-progres svg { width: 64px; height: 64px; flex: none; transform: rotate(-90deg); }
.rec-progres circle { fill: none; stroke: var(--trait); stroke-width: 6; }
.rec-progres .rec-arc { stroke: var(--vert); stroke-linecap: round; stroke-dasharray: 169.65; stroke-dashoffset: calc(169.65 * (1 - var(--k))); transition: stroke-dashoffset .8s var(--ease); }
.rec-progres strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.rec-progres small { color: var(--texte-2); font-size: 14.5px; }
.rec-progres.complet strong { color: var(--vert); }
.rec-plus { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rec-plus p { width: 100%; font-weight: 600; font-size: 14px; }
.rec-liste { display: grid; gap: 10px; }
.rec-item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px; border-radius: 20px; background: var(--fond); transition: box-shadow .5s var(--ease); }
.rec-item:has(details[open]) { box-shadow: 0 20px 44px -30px rgba(0, 0, 0, .35); }
.rec-case { display: grid; place-items: center; width: 46px; height: 46px; border: 1.5px solid var(--trait); border-radius: 13px; background: var(--fond); color: transparent; cursor: pointer; transition: background .4s var(--ease), border-color .4s, color .3s, transform .2s var(--ease); }
.rec-case:hover { border-color: var(--vert); }
.rec-case:active { transform: scale(.9); }
.rec-case .ico { stroke-width: 3; }
.rec-case[aria-pressed="true"] { background: var(--vert); border-color: var(--vert); color: #fff; }
.rec-case[aria-pressed="true"] .ico { animation: pop .4s var(--ease) both; }
.rec-item summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding-top: 2px; list-style: none; cursor: pointer; }
.rec-item summary::-webkit-details-marker { display: none; }
.rec-item summary::after { content: "+"; padding-top: 2px; font-size: 22px; line-height: 1; color: var(--texte-2); transition: transform .45s var(--ease); }
.rec-item details[open] summary::after { transform: rotate(45deg); }
.rec-n { display: none; }
.rec-t strong { display: block; font-size: 17px; font-weight: 600; text-decoration: line-through; text-decoration-color: transparent; transition: text-decoration-color .4s; }
.rec-item.fait .rec-t strong { text-decoration-color: var(--vert); }
.rec-t small { display: block; color: var(--texte-2); font-size: 14.5px; }
.rec-item details::details-content { block-size: 0; overflow: clip; transition: block-size .5s var(--ease), content-visibility .5s allow-discrete; }
.rec-item details[open]::details-content { block-size: auto; }
.rec-corps { padding-top: 16px; }
.rec-photos { display: grid; grid-template-columns: repeat(2, minmax(0, 170px)); gap: 10px; }
.rec-photos figure { display: grid; gap: 6px; }
.rec-photos .visuel { aspect-ratio: 1; border-radius: 12px; }
.rec-photos figcaption { font-size: 13px; color: var(--texte-2); line-height: 1.35; }
.odeur { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 22px; }
.odeur::before { content: ""; position: absolute; left: 6px; right: 6px; top: 5px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--vert), color-mix(in srgb, var(--vert) 30%, var(--fond-2))); }
.odeur span { position: relative; display: grid; gap: 2px; font-size: 13.5px; color: var(--texte-2); }
.odeur span::before { content: ""; position: absolute; left: 0; top: -22px; width: 13px; height: 13px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 4px var(--fond); }
.odeur b { font-size: 15px; color: var(--texte); }
details[open] .odeur span { animation: fondu .5s var(--ease) both; animation-delay: calc(var(--i) * 140ms + 150ms); }
.modale-large { width: min(640px, 100%); }

/* ——— le guide, ouvert en panneau ——— */
.guide-contenu { display: grid; gap: 16px; }
.guide-contenu h3 { padding-right: 36px; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
.guide-contenu > p { color: var(--texte-2); }
.guide-lot { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
.guide-lot figure { display: grid; gap: 6px; }
.guide-lot .visuel { border-radius: 12px; aspect-ratio: 1; }
.guide-lot figcaption { font-size: 13.5px; color: var(--texte-2); text-align: center; }
.guide-egal { font-size: 34px; font-weight: 300; color: var(--vert); }
.guide-astuces { display: grid; gap: 14px; }
.guide-astuces li { display: flex; gap: 14px; align-items: flex-start; color: var(--texte-2); }
.guide-astuces .ico { width: 38px; height: 38px; padding: 9px; flex: none; border-radius: 50%; background: var(--fond-2); color: var(--texte); }
.guide-astuces strong { color: var(--texte); }
.concentrations { display: grid; gap: 14px; padding: 6px 0; }
.conc { display: grid; grid-template-columns: 140px minmax(0, 1fr) 82px; align-items: center; gap: 14px; font-size: 14.5px; }
.conc-barre { position: relative; height: 12px; border-radius: 6px; background: var(--fond-2); overflow: hidden; }
.conc-barre i { position: absolute; top: 0; bottom: 0; left: calc(var(--a) * 100%); width: calc((var(--b) - var(--a)) * 100%); border-radius: 6px; background: var(--texte); transform-origin: left; animation: barre .9s var(--ease) both; animation-delay: calc(var(--i) * 120ms + 150ms); }
@keyframes barre { from { transform: scaleX(0); } }
@keyframes jour { from { background: var(--trait); transform: scaleY(.5); } }
.conc-val { text-align: right; color: var(--texte-2); font-variant-numeric: tabular-nums; }

/* ——— vendre : maison proposée ——— */
.aide-maison { padding: 10px 12px; border-radius: 10px; background: var(--fond-2); }
.note-ajout { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--fond-2); }
.note-ajout .ico { flex: none; margin-top: 2px; }
.note-ajout a { font-weight: 600; }

/* ——— panel équipe ——— */
.panel-tete { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
.onglets { display: flex; flex-wrap: wrap; gap: 6px; margin: 24px 0 18px; padding: 4px; border-radius: 12px; background: var(--fond-2); width: fit-content; max-width: 100%; }
.onglets button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 0; border-radius: 9px; background: none; font-weight: 600; font-size: 14.5px; color: var(--texte-2); cursor: pointer; transition: background .3s, color .3s; }
.onglets button[aria-selected="true"] { background: var(--fond); color: var(--texte); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.compte { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #e0245e; color: #fff; font-size: 12px; }
.p-carte { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; margin-bottom: 14px; padding: 18px; border: 1px solid var(--trait); border-radius: 16px; animation: fondu .5s var(--ease) both; }
.p-photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-content: start; }
.p-photos span { border-radius: 8px; overflow: hidden; }
.p-infos { display: grid; gap: 8px; align-content: start; }
.p-alerte { padding: 8px 12px; border-radius: 9px; background: #fdf0e3; color: #8a4b0b; font-size: 14px; font-weight: 600; }
.p-checks { margin: 6px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; }
.p-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.p-actions label:not(.vh) { font-weight: 600; font-size: 14px; width: 100%; }
.p-actions .champ:not(.champ-petit) { flex: 1 1 220px; width: auto; min-height: 40px; }
[data-publier].pret { background: var(--vert); border-color: var(--vert); color: #fff; }
.p-prop { grid-template-columns: 1fr; }
.p-prop-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pastille { padding: 3px 10px; border-radius: 99px; background: var(--texte); color: var(--fond); font-size: 12px; font-weight: 700; }
.p-tape { font-size: 17px; }
.p-tape q { font-weight: 600; quotes: "« " " »"; }
.p-ressemble { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-radius: 10px; background: #fff7d6; color: #5c4a00; font-size: 14.5px; }
.p-ressemble .ico { width: 18px; height: 18px; }

/* ——— comment ça marche ——— */
.fn-hero { display: grid; justify-items: start; gap: 14px; padding-block: 64px 24px; }
.fn-hero h1 { font-weight: 650; font-size: clamp(2.2rem, 5vw, 3.8rem); line-height: 1.04; letter-spacing: -.035em; max-width: 16ch; text-wrap: balance; }
.fn-hero .chapo { max-width: 58ch; }
.bascule { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; padding: 4px; border-radius: 14px; background: var(--fond-2); }
.bascule button { position: relative; z-index: 1; min-height: 46px; padding: 10px 28px; border: 0; background: none; font-weight: 600; font-size: 15.5px; color: var(--texte-2); cursor: pointer; transition: color .4s var(--ease); }
.bascule button[aria-selected="true"] { color: var(--sur-noir); }
.bascule-pastille { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px; background: var(--noir); transform: translateX(calc(var(--x) * 100%)); transition: transform .55s var(--ease); }

.histoire { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; padding-block: 24px 40px; }
.histoire-etapes { position: relative; }
.histoire-etapes::before { content: ""; position: absolute; left: 21px; top: 30vh; bottom: 30vh; width: 1px; background: var(--trait); }
.h-etape { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 24px; align-content: center; min-height: 62vh; opacity: .32; transition: opacity .6s var(--ease); }
.h-etape.actif { opacity: 1; }
.h-num { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--fond); border: 1px solid var(--trait); font-weight: 700; font-size: 14px; transition: background .5s var(--ease), color .5s, border-color .5s; }
.h-etape.actif .h-num { background: var(--noir); border-color: var(--noir); color: var(--sur-noir); }
.h-texte h3 { font-weight: 650; font-size: clamp(1.4rem, 2.4vw, 1.9rem); letter-spacing: -.025em; line-height: 1.15; margin-bottom: 12px; }
.h-texte p { font-size: 17px; color: var(--texte-2); max-width: 44ch; }
.h-scene-mobile { display: none; }
.histoire-scene { position: sticky; top: calc(50vh - 250px); height: 500px; display: grid; grid-template-rows: 1fr auto; gap: 16px; align-self: start; margin-top: 18vh; }
.scene-cadre { position: relative; }
.scene-cadre .scene { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transform: translateY(18px) scale(.98); transition: opacity .6s var(--ease), transform .8s var(--ease); pointer-events: none; }
.scene-cadre .scene.actif { opacity: 1; transform: none; }
.scene-points { display: flex; justify-content: center; gap: 8px; }
.scene-points i { width: 7px; height: 7px; border-radius: 4px; background: var(--trait); transition: width .5s var(--ease), background .5s; }
.scene-points i.actif { width: 26px; background: var(--texte); }

/* les scènes : une carte, une animation qui se rejoue quand l'étape devient active */
.scene > div { position: relative; width: min(420px, 100%); min-height: 430px; padding: 30px; border-radius: 26px; background: var(--fond-2); display: grid; align-content: center; gap: 16px; overflow: hidden; }
.sc-label { font-size: 13px; font-weight: 600; color: var(--texte-2); }
.sc-champ { display: flex; align-items: center; gap: 2px; height: 50px; padding: 0 16px; border-radius: 12px; background: var(--fond); box-shadow: 0 1px 0 var(--trait), 0 8px 24px -16px rgba(0, 0, 0, .3); font-size: 17px; }
.sc-tape { white-space: nowrap; overflow: hidden; }
.sc-curseur { width: 2px; height: 22px; background: var(--texte); animation: curseur 1s steps(1) infinite; }
@keyframes curseur { 50% { opacity: 0; } }
.sc-liste { display: grid; gap: 6px; padding: 8px; border-radius: 14px; background: var(--fond); }
.sc-liste li { padding: 10px 12px; border-radius: 9px; font-size: 15px; color: var(--texte-2); }
.sc-ajout { background: var(--texte); color: var(--fond) !important; font-weight: 600; }
.sc-bulle { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--vert-fond); color: var(--vert); font-weight: 600; font-size: 14px; }
.sc-bulle .ico { width: 18px; height: 18px; flex: none; }
.actif .sc-tape { animation: tape 1.3s steps(13) both; }
@keyframes tape { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.actif .sc-liste li { animation: fondu .5s var(--ease) both; animation-delay: calc(1.3s + var(--i) * 120ms); }
.actif .sc-ajout { animation: fondu .5s var(--ease) both, appui .5s var(--ease) 2.2s; }
@keyframes appui { 50% { transform: scale(.96); } }
.actif .sc-bulle { animation: fondu .6s var(--ease) both; animation-delay: 2.6s; }

.sc-grille { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sc-photo { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 24px -18px rgba(0, 0, 0, .5); }
.sc-photo b { position: absolute; right: 6px; bottom: 6px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--vert); color: #fff; }
.sc-photo b .ico { width: 13px; height: 13px; stroke-width: 3; }
.actif .sc-photo { animation: photoIn .55s var(--ease) both; animation-delay: calc(var(--i) * 220ms + 150ms); }
.actif .sc-photo b { animation: pop .4s var(--ease) both; animation-delay: calc(var(--i) * 220ms + 520ms); }
@keyframes photoIn { from { opacity: 0; transform: scale(.82) translateY(10px); } }
.sc-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.actif .sc-flash { animation: flash 1.5s ease-out; }
@keyframes flash { 8% { opacity: .7; } 30% { opacity: 0; } }

.sc-verif { grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); align-items: center; }
.sc-scan { position: relative; border-radius: 14px; overflow: hidden; }
.sc-ligne { position: absolute; left: 0; right: 0; top: 0; height: 30%; background: linear-gradient(180deg, transparent, rgba(11, 122, 75, .25) 80%, rgba(11, 122, 75, .9) 100%); transform: translateY(-100%); }
.actif .sc-ligne { animation: scan 2.2s cubic-bezier(.45, 0, .55, 1) infinite; }
@keyframes scan { to { transform: translateY(340%); } }
.sc-checks { display: grid; gap: 10px; }
.sc-checks li { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 500; }
.sc-checks b { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--vert); color: #fff; }
.sc-checks b .ico { width: 13px; height: 13px; stroke-width: 3; }
.actif .sc-checks li { animation: verifie .5s var(--ease) both; animation-delay: calc(var(--i) * 420ms + 400ms); }
.actif .sc-checks b { animation: pop .4s var(--ease) both; animation-delay: calc(var(--i) * 420ms + 450ms); }
@keyframes verifie { from { opacity: .25; } }
.sc-chip { grid-column: 1 / -1; justify-self: center; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 99px; background: var(--noir); color: var(--sur-noir); font-weight: 600; font-size: 14px; }
.sc-chip .ico { width: 16px; height: 16px; }
.actif .sc-chip { animation: fondu .5s var(--ease) both; animation-delay: 2.7s; }
.sc-verif-acheteur { grid-template-columns: auto minmax(0, 1fr); gap: 24px; }

.sc-colis { justify-items: stretch; }
.sc-notif { padding: 14px 16px; border-radius: 14px; background: var(--fond); font-weight: 650; box-shadow: 0 10px 30px -18px rgba(0, 0, 0, .4); }
.actif .sc-notif { animation: notif .6s var(--ease) both; }
@keyframes notif { from { opacity: 0; transform: translateY(-16px) scale(.96); } }
.sc-route { position: relative; height: 90px; }
.sc-route svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sc-route path { fill: none; stroke: var(--texte-2); stroke-width: 2; stroke-dasharray: 6 7; vector-effect: non-scaling-stroke; }
.sc-camion { position: absolute; left: 82%; top: 8px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--noir); color: var(--sur-noir); }
.actif .sc-camion { animation: route 2.6s cubic-bezier(.5, 0, .3, 1) both .3s; }
@keyframes route { from { left: 0; top: 50px; } 50% { top: 18px; } }
.sc-sous { color: var(--texte-2); font-size: 14px; text-align: center; }

.sc-paye, .sc-bloque { justify-items: center; text-align: center; }
.sc-anneau { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
.sc-anneau-petit { width: 110px; height: 110px; }
.sc-anneau svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.sc-anneau circle { fill: none; stroke: var(--trait); stroke-width: 8; }
.sc-anneau .sc-anneau-plein { stroke: var(--vert); stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; }
.actif .sc-anneau-plein { animation: anneau 2s var(--ease) both .2s; }
@keyframes anneau { from { stroke-dashoffset: 327; } }
.sc-anneau span { font-weight: 700; font-size: 26px; }
.sc-anneau-petit span { font-size: 19px; }
.sc-montant { font-weight: 700; font-size: 38px; letter-spacing: -.03em; }
.actif .sc-paye .sc-montant { animation: pop .6s var(--ease) both 2s; }
.sc-cadenas { width: 92px; height: 110px; }
.sc-cadenas rect { fill: var(--noir); }
.sc-cadenas circle { fill: var(--fond-2); }
.sc-anse { fill: none; stroke: var(--noir); stroke-width: 8; stroke-linecap: round; }
.actif .sc-anse { animation: ferme .7s cubic-bezier(.5, -0.3, .4, 1.4) both .4s; }
@keyframes ferme { from { transform: translateY(-14px); } }
.actif .sc-bloque .sc-montant { animation: fondu .6s var(--ease) both .9s; }

.sc-filtre { display: flex; flex-wrap: wrap; gap: 6px; }
.sc-filtre span { padding: 7px 12px; border-radius: 99px; background: var(--fond); font-size: 13px; font-weight: 600; }
.sc-cartes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sc-carte { position: relative; border-radius: 12px; overflow: hidden; }
.sc-carte b { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .92); color: #161616; font-size: 12.5px; }
.sc-carte:first-child { outline: 2px solid var(--texte); outline-offset: 2px; }
.actif .sc-filtre span { animation: fondu .4s var(--ease) both; }
.actif .sc-carte { animation: photoIn .6s var(--ease) both; animation-delay: calc(var(--i) * 160ms + .3s); }

.sc-fin { gap: 12px; }
.sc-issue { display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 16px; background: var(--fond); }
.sc-issue b { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; color: #fff; }
.sc-issue-ok b { background: var(--vert); }
.sc-issue-pb b { background: #c2410c; }
.sc-issue strong { display: block; font-size: 16px; }
.sc-issue span { color: var(--texte-2); font-size: 14.5px; }
.sc-issue strong { color: var(--texte); }
.actif .sc-issue { animation: fondu .6s var(--ease) both; }
.actif .sc-issue-pb { animation-delay: .35s; }

/* les autres sections */
.fn-section { padding-top: 96px; }
.fn-tete { display: grid; gap: 10px; max-width: 760px; margin-bottom: 30px; }
.fn-tete .surtitre { margin-bottom: 0; }
.fn-photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 14px; }
.fn-photo { display: grid; gap: 10px; transition-delay: calc(var(--i) * 60ms); }
.fn-photo .visuel { border-radius: 16px; }
.fn-photo figcaption { display: grid; gap: 2px; }
.fn-photo strong { font-size: 15px; }
.fn-photo span { color: var(--texte-2); font-size: 14px; }
.fn-photo em { justify-self: start; margin-top: 4px; padding: 2px 8px; border: 1px dashed var(--texte-2); border-radius: 99px; font-style: normal; font-size: 12px; color: var(--texte-2); }
.fn-equipe { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 64px; align-items: center; }
.fn-equipe-visuel { position: relative; border-radius: 22px; overflow: hidden; }
.repere { position: absolute; left: var(--x); top: var(--y); display: grid; place-items: center; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--noir); color: var(--sur-noir); font-weight: 700; font-size: 14px; box-shadow: 0 0 0 6px rgba(255, 255, 255, .55); }
.repere::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--noir); opacity: 0; animation: onde 2.4s ease-out infinite; animation-delay: calc(var(--i) * .5s); }
@keyframes onde { 0% { opacity: .5; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.8); } }
.vu .repere { animation: pop .5s var(--ease) both; animation-delay: calc(var(--i) * 160ms + 200ms); }
.balayage { position: absolute; left: 0; right: 0; top: 0; height: 25%; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .55)); transform: translateY(-100%); pointer-events: none; }
.vu .balayage { animation: scan 1.8s cubic-bezier(.45, 0, .55, 1) .2s 1; }
.liste-num { counter-reset: n; display: grid; gap: 16px; margin: 22px 0 16px; }
.liste-num li { counter-increment: n; position: relative; padding-left: 50px; color: var(--texte-2); font-size: 16px; }
.liste-num li::before { content: counter(n); position: absolute; left: 0; top: -4px; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--noir); color: var(--sur-noir); font-weight: 700; font-size: 14px; }
.liste-num strong { color: var(--texte); }

.sept { display: grid; gap: 28px; }
.sept-piste { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); padding-top: 26px; }
.sept-piste::before, .sept-rempli { content: ""; position: absolute; left: 6.25%; right: 6.25%; top: 32px; height: 4px; border-radius: 2px; background: var(--trait); }
.sept-rempli { background: var(--vert); transform-origin: left; }
.vu .sept-rempli { animation: barre 2.4s cubic-bezier(.45, 0, .2, 1) both .2s; }
.sept-jour { position: relative; display: grid; justify-items: center; gap: 12px; font-weight: 600; font-size: 14px; color: var(--texte-2); }
.sept-jour b { width: 16px; height: 16px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 5px var(--fond); }
.vu .sept-jour b { animation: jour .4s var(--ease) both; animation-delay: calc(var(--i) * 300ms + 200ms); }
.sept-cartes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.sept-cartes article { padding: 22px; border-radius: 18px; background: var(--fond-2); }
.sept-cartes h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.sept-cartes p { color: var(--texte-2); }

.flux { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: f; }
.flux li { position: relative; display: grid; gap: 8px; padding: 24px; border-radius: 18px; border: 1px solid var(--trait); transition: transform .9s var(--ease); transition-delay: calc(var(--i) * 120ms); }
.flux li > span { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--fond-2); margin-bottom: 6px; }
.flux li strong { font-size: 17px; }
.flux li p { color: var(--texte-2); font-size: 15px; }
.flux li:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 34px; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--fond); border: 1px solid var(--trait); font-size: 14px; }
.js-anime .flux:not(.vu) li { transform: translateY(26px); }
.fn-note { margin-top: 16px; }

.fn-frais { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.calcul { display: grid; gap: 16px; padding: 28px; border-radius: 22px; background: var(--fond-2); }
.calcul label { font-weight: 600; }
.calcul output { font-variant-numeric: tabular-nums; }
.calcul-res { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.calcul-res > div { display: grid; gap: 2px; padding: 18px; border-radius: 16px; background: var(--fond); }
.calcul-res span { color: var(--texte-2); font-size: 14px; }
.calcul-res strong { font-size: clamp(1.5rem, 2.6vw, 2rem); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.calcul-res small { color: var(--texte-2); }
.calcul-res > div:last-child strong { color: var(--vert); }

.interdits { display: flex; flex-wrap: wrap; gap: 10px; }
.interdits li { display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 12px; border-radius: 99px; background: var(--fond-2); font-weight: 500; transition: transform .8s var(--ease); transition-delay: calc(var(--i) * 70ms); }
.interdits .ico { width: 28px; height: 28px; padding: 6px; border-radius: 50%; background: var(--fond); color: var(--rouge); stroke-width: 2.4; }
.js-anime .interdits:not(.vu) li { transform: translateY(20px); }

.faq details::details-content { block-size: 0; overflow: clip; transition: block-size .45s var(--ease), content-visibility .45s allow-discrete; }
.faq details[open]::details-content { block-size: auto; }
.faq summary::after { transition: transform .4s var(--ease); }
.fonctionnement .faq details { max-width: 860px; }
.fn-fin .boutons { justify-content: center; }
.fn-fin .boutons .btn { flex: 0 0 auto; }
.fn-fin { display: grid; justify-items: center; gap: 22px; margin-block: 96px 72px; padding-block: 64px; border-radius: 28px; background: var(--panneau); color: var(--sur-panneau); text-align: center; }
.fn-fin h2 { font-weight: 650; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -.035em; }
.fn-fin .btn:not(.btn-noir) { background: transparent; color: var(--sur-panneau); border-color: rgba(255, 255, 255, .35); }
.fn-fin .btn-noir { background: var(--sur-panneau); border-color: var(--sur-panneau); color: #1c1b1a; }

/* ——— écrans moyens et petits ——— */
@media (max-width: 960px) {
  .fn-equipe, .fn-frais, .anatomie, .reception { grid-template-columns: minmax(0, 1fr); }
  .anatomie { gap: 32px; }
  .rec-gauche { position: static; }
  .portes-in { flex-direction: column; height: auto; }
  .porte, .porte-vendre { flex: none; min-height: 500px; }
  .porte-acheter .porte-texte, .porte-vendre .porte-texte { width: 100%; }
  .p-carte { grid-template-columns: minmax(0, 1fr); }
  .histoire { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .histoire-scene { display: none; }
  .histoire-etapes::before { display: none; }
  .h-etape { min-height: 0; opacity: 1; padding-block: 28px; }
  .h-scene-mobile { display: grid; place-items: center; grid-column: 1 / -1; }
  .fn-photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sept-cartes, .flux { grid-template-columns: minmax(0, 1fr); }
  .flux li:not(:last-child)::after { content: "↓"; right: auto; left: 34px; top: auto; bottom: -14px; }
}
@media (max-width: 640px) {
  .porte { padding: 26px 22px; min-height: 0; }
  .porte-acheter { padding-bottom: 0; }
  .pile { position: relative; right: auto; bottom: auto; width: 100%; height: 250px; margin: 24px 0 -30px; }
  .pile-photo { width: 140px; }
  .porte-vendre { min-height: 470px; }
  .ruban { grid-auto-columns: 200px; }
  .ruban-fleches { display: none; }
  .z0 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .anat-grande { grid-row: auto; }
  .anat-minis span:nth-child(n + 4) { display: none; }
  .rec-item { grid-template-columns: 40px minmax(0, 1fr); padding: 14px; }
  .rec-case { width: 40px; height: 40px; }
  .conc { grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 10px; font-size: 13.5px; }
  .p-checks { grid-template-columns: minmax(0, 1fr); }
  .sc-verif { grid-template-columns: minmax(0, 1fr); }
  .scene > div { padding: 22px; min-height: 0; }
  .sept-jour { font-size: 12px; }
  .fn-section { padding-top: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  .pile-photo { animation: none; }
  .brume circle { animation: none; opacity: .7; transform: translate(var(--dx), var(--dy)); }
  .scene-cadre .scene { transition: none; }
}

/* ——— identité ——— */
.marque-page { padding-bottom: 96px; }
.mq-hero { display: grid; justify-items: center; gap: 22px; padding-block: 96px 72px; text-align: center; }
.mq-logo { color: var(--texte); }
.mq-logo .logo-svg { height: clamp(56px, 10vw, 112px); }
.mq-signature { font-size: clamp(1.2rem, 2.2vw, 1.6rem); font-weight: 500; letter-spacing: -.02em; color: var(--texte-2); }
.mq-section { padding-top: 96px; }
.mq-tete { display: grid; gap: 12px; max-width: 720px; margin-bottom: 32px; }
.mq-symbole { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; align-items: center; }
.mq-construction { padding: 32px; border-radius: 28px; background: var(--fond-2); color: var(--texte); }
.mq-construction svg { display: block; width: 100%; height: auto; }
.mq-grille line { stroke: var(--trait); stroke-width: .3; }
.mq-guide { fill: none; stroke: #2f80ed; stroke-width: .4; stroke-dasharray: 1.5 1.5; }
.vu .mq-trace path { stroke-dasharray: 80; animation: trace 1.4s var(--ease) both; }
@keyframes trace { from { stroke-dashoffset: 80; } }
.vu .mq-trace .p1 { animation: pop .45s var(--ease) both 1.1s; }
.vu .mq-trace .p2 { animation: pop .45s var(--ease) both 1.35s; }
.vu .mq-trace .p3 { animation: pop .45s var(--ease) both 1.6s; }
.mq-trace circle { transform-box: fill-box; transform-origin: center; }
.mq-texte { display: grid; gap: 18px; }
.mq-texte > p { font-size: 18px; color: var(--texte-2); max-width: 46ch; }
.mq-mesures { display: grid; border-top: 1px solid var(--trait); }
.mq-mesures div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--trait); font-size: 15px; }
.mq-mesures dt { color: var(--texte-2); }
.mq-mesures dd { margin: 0; font-weight: 500; }
.mq-versions { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.mq-v { display: grid; gap: 10px; grid-column: span 2; }
.mq-v-large { grid-column: span 3; }
.mq-v figcaption { font-size: 14px; color: var(--texte-2); }
.mq-v-fond { display: grid; place-items: center; height: 220px; border-radius: 22px; border: 1px solid var(--trait); background: #ffffff; color: #1d1d1f; }
.mq-v-fond .logo-svg { height: 46px; }
.mq-sombre { background: #1d1d1f; border-color: #1d1d1f; color: #f5f5f7; }
.mq-gris { background: #f5f5f7; border-color: #f5f5f7; }
.mq-sym { width: 86px; height: auto; color: #1d1d1f; }
.mq-icone { --t: 112px; display: grid; place-items: center; width: var(--t); height: var(--t); border-radius: calc(var(--t) * .225); background: #1d1d1f; color: #ffffff; }
.mq-icone svg { width: 58%; height: auto; }
.mq-tailles { grid-auto-flow: column; justify-content: center; align-items: center; gap: 22px; }
.mq-regle { margin-top: 18px; max-width: 72ch; }
.mq-couleurs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mq-couleur { display: grid; gap: 4px; justify-items: start; padding: 14px 14px 18px; border: 1px solid var(--trait); border-radius: 22px; background: var(--fond); text-align: left; cursor: pointer; transition: transform .4s var(--ease), border-color .3s; }
.mq-couleur:hover { transform: translateY(-3px); border-color: var(--texte-2); }
.mq-pastille { width: 100%; height: 110px; margin-bottom: 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.mq-couleur strong { font-size: 16px; }
.mq-hex { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--texte-2); letter-spacing: .02em; }
.mq-couleur small { font-size: 13.5px; color: var(--texte-2); }
.mq-typo-in { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 48px; align-items: center; padding: 40px; border-radius: 28px; background: var(--fond-2); }
.mq-aa { font-size: clamp(7rem, 18vw, 14rem); font-weight: 600; letter-spacing: -.06em; line-height: .9; }
.mq-echelle { display: grid; gap: 18px; }
.mq-e1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; }
.mq-e2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.mq-e3 { font-size: 16px; color: var(--texte-2); max-width: 44ch; }
.mq-e4 { font-size: 13px; font-weight: 500; color: var(--texte-2); }
.mq-dessins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 14px; }
.mq-dessins figure { display: grid; gap: 8px; }
.mq-dessins .visuel { border-radius: 18px; }
.mq-dessins figcaption { font-size: 13.5px; color: var(--texte-2); }
.mq-elements { display: grid; gap: 18px; padding: 32px; border-radius: 28px; border: 1px solid var(--trait); }
.mq-elements > div { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mq-verif { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 980px; background: var(--vert-fond); color: var(--vert); font-weight: 600; font-size: 14px; }
.mq-verif .ico { width: 16px; height: 16px; stroke-width: 2.4; }
.mq-pilule-sombre { padding: 6px 12px; border-radius: 980px; background: var(--noir); color: var(--sur-noir); font-weight: 600; font-size: 14px; }
.mq-ton { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mq-ton > div { display: grid; gap: 10px; padding: 28px; border-radius: 24px; background: var(--fond-2); font-size: 18px; }
.mq-oui, .mq-non { font-size: 13px !important; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.mq-oui { color: var(--vert); }
.mq-non { color: var(--rouge); }
.mq-ton > div p:not(.mq-oui):not(.mq-non) { color: var(--texte); }
.mq-ton > div:last-child p:not(.mq-non) { color: var(--texte-2); text-decoration: line-through; text-decoration-color: var(--trait); }
@media (max-width: 960px) {
  .mq-symbole, .mq-typo-in { grid-template-columns: minmax(0, 1fr); }
  .mq-versions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mq-v, .mq-v-large { grid-column: span 1; }
  .mq-v-large { grid-column: span 2; }
  .mq-couleurs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mq-dessins { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .mq-versions, .mq-ton { grid-template-columns: minmax(0, 1fr); }
  .mq-v-large { grid-column: span 1; }
  .mq-v-fond { height: 180px; }
  .mq-typo-in { padding: 24px; }
}

/* Les dessins du prototype. Ils tiennent la place des photos que prendront les vendeurs : une vue par photo
   obligatoire. Style : dessin technique. Un trait fin d'épaisseur constante (quelle que soit la taille), des aplats
   sans dégradé, aucun reflet ni ombre floue ; des repères de mesure quand ils servent (niveau, code lot). Formes
   génériques : aucun flacon de marque n'est reproduit. */
const Dessins = (() => {
  let uid = 0;
  const ENCRE = '#1d1d1f';
  const FOND = '#f3f3f5';
  const T = 'fill="none" stroke="#1d1d1f" stroke-width="1.25" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"';
  const TF = (f) => `fill="${f}" stroke="#1d1d1f" stroke-width="1.25" vector-effect="non-scaling-stroke" stroke-linejoin="round"`;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const melange = (hex, k) => {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (255 - v) * k));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  };
  // couleur du bouchon, à plat : noir, or, argent, ou sa teinte éclaircie
  const capuchon = (p) => {
    const n = parseInt(p.bouchon.slice(1), 16);
    const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255];
    if (r + g + b < 200) return '#2c2c2e';
    if (r > 120 && r - b > 40) return '#dccca4';
    return melange(p.bouchon, 0.45);
  };
  const bague = (p) => (capuchon(p) === '#dccca4' ? '#e6dcc0' : '#e3e4e8');
  const jus = (p) => melange(p.jus, 0.42);

  /* les flacons, de face, dans un repère de 120 × 200 */
  const FORMES = {
    tour: {corps: [32, 66, 56, 124, 6], col: [51, 55, 18, 12], bouchon: [42, 16, 36, 40, 3], dessus: 'rect'},
    carre: {corps: [16, 90, 88, 100, 10], col: [48, 79, 24, 12], bouchon: [36, 40, 48, 40, 3], dessus: 'rect'},
    galet: {corps: [16, 82, 88, 108, 44], col: [51, 69, 18, 14], bouchon: [40, 32, 40, 38, 19], dessus: 'rond'},
    cylindre: {corps: [33, 60, 54, 130, 12], col: [53, 50, 14, 11], bouchon: [44, 14, 32, 37, 6], dessus: 'rond'},
    apothicaire: {corps: [25, 76, 70, 114, 4], col: [47, 61, 26, 16], bouchon: [45, 28, 30, 34, 2], etiquette: true, dessus: 'rect'},
    facette: {chemin: 'M25 87 H95 L104 126 L97 190 H23 L16 126 Z', corps: [16, 87, 88, 103], col: [50, 74, 20, 14], bouchon: [39, 32, 42, 42, 2], dessus: 'octo'},
  };
  function flacon(p, niveau, sansBouchon, id) {
    const f = FORMES[p.forme];
    const [x, y, w, h, r] = f.corps;
    const forme = (attrs) => (f.chemin ? `<path d="${f.chemin}" ${attrs}/>` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${attrs}/>`);
    const haut = y + 7;
    const bas = y + h - 6;
    const surface = bas - (niveau / 100) * (bas - haut);
    const [bx, by, bw, bh, br] = f.bouchon;
    const [cx, cy, cw, ch] = f.col;
    const dessus = sansBouchon
      ? `<rect x="${cx - 3}" y="${cy - 8}" width="${cw + 6}" height="9" rx="1.5" ${TF(bague(p))}/>
         <rect x="${cx + cw / 2 - 4.5}" y="${cy - 17}" width="9" height="9" rx="2" ${TF('#ffffff')}/>
         <circle cx="${cx + cw / 2 - 4.5}" cy="${cy - 12.5}" r=".9" fill="${ENCRE}"/>`
      : `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${br}" ${TF(capuchon(p))}/>`;
    return `<defs><clipPath id="c${id}">${forme('')}</clipPath></defs>
      <rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" ${TF('#ffffff')}/>
      ${dessus}
      ${forme('fill="#ffffff"')}
      <g clip-path="url(#c${id})"><rect x="0" y="${surface}" width="120" height="${200 - surface}" fill="${jus(p)}"/>
        <line x1="0" x2="120" y1="${surface}" y2="${surface}" ${T}/>
        <line x1="0" x2="120" y1="${bas}" y2="${bas}" ${T} opacity=".35"/></g>
      ${forme(T)}
      ${f.etiquette ? `<rect x="${x + 13}" y="${y + 34}" width="${w - 26}" height="42" ${TF('#ffffff')}/><line x1="${x + 20}" x2="${x + w - 20}" y1="${y + 47}" y2="${y + 47}" ${T}/><line x1="${x + 24}" x2="${x + w - 24}" y1="${y + 55}" y2="${y + 55}" ${T} opacity=".5"/>` : ''}`;
  }

  /* vu de dessus, sans bouchon : l'épaule, la bague sertie et le bouton spray, ou la tige une fois le bouton retiré */
  function dessus(p, sansBouton) {
    const f = FORMES[p.forme];
    const epaule = f.dessus === 'rond' ? `<circle cx="150" cy="180" r="108" ${TF('#ffffff')}/>` : f.dessus === 'octo' ? `<path d="M92 76 H208 L254 122 V238 L208 284 H92 L46 238 V122 Z" ${TF('#ffffff')}/>` : `<rect x="48" y="80" width="204" height="200" rx="${p.forme === 'carre' ? 18 : 8}" ${TF('#ffffff')}/>`;
    const crans = Array.from({length: 24}, (_, i) => {
      const a = (i / 24) * Math.PI * 2;
      return `<line x1="${(150 + Math.cos(a) * 29).toFixed(1)}" y1="${(180 + Math.sin(a) * 29).toFixed(1)}" x2="${(150 + Math.cos(a) * 34).toFixed(1)}" y2="${(180 + Math.sin(a) * 34).toFixed(1)}" ${T} opacity=".55"/>`;
    }).join('');
    const bouton = `<circle cx="150" cy="180" r="19" ${TF('#ffffff')}/><circle cx="166" cy="180" r="2" fill="${ENCRE}"/>`;
    const tige = `<circle cx="150" cy="180" r="6" ${TF('#ffffff')}/><circle cx="150" cy="180" r="1.8" fill="${ENCRE}"/>
      <g transform="translate(236 302)"><circle r="19" ${TF('#ffffff')}/><circle r="6.5" ${T}/><circle r="1.8" fill="${ENCRE}"/></g>
      <line x1="170" y1="194" x2="216" y2="286" ${T} stroke-dasharray="2 4" opacity=".5"/>`;
    return `${epaule}<circle cx="150" cy="180" r="${f.dessus === 'rond' ? 78 : 74}" fill="${jus(p)}" opacity=".55"/>
      <circle cx="150" cy="180" r="44" ${TF('#ffffff')}/>
      <circle cx="150" cy="180" r="36" ${TF(bague(p))}/>${crans}<circle cx="150" cy="180" r="27" ${TF(bague(p))}/>
      ${sansBouton ? tige : bouton}`;
  }

  const LEGENDES = {
    face: 'le flacon de face',
    dessous: 'le dessous du flacon et le code lot',
    niveau: 'le niveau',
    preuve: 'le flacon avec le pseudo du vendeur et la date',
    dessus: 'le flacon sans bouchon, vu de dessus, avec le spray',
    tige: 'le flacon sans le bouton spray, la tige visible',
    boite: 'la boîte',
    ticket: 'le ticket d\'achat',
  };

  /* une « photo » d'annonce : a (l'annonce), p (le parfum), vue, pseudo du vendeur */
  function photo(a, p, vue = 'face', pseudo = '', classe = '') {
    const id = ++uid;
    let vb = '0 0 300 375';
    let scene;
    const sol = `<ellipse cx="150" cy="${72 + 190 * 1.25 + 3}" rx="62" ry="4" fill="${ENCRE}" opacity=".06"/>`;
    const deFace = () => `${sol}<g transform="translate(75 72) scale(1.25)">${flacon(p, a.niveau, false, id)}</g>`;
    if (vue === 'dessous') {
      scene = `<circle cx="150" cy="186" r="104" ${TF('#ffffff')}/><circle cx="150" cy="186" r="86" fill="${jus(p)}" opacity=".45"/><circle cx="150" cy="186" r="86" ${T} opacity=".4"/>
        <text x="150" y="182" text-anchor="middle" class="d-code">${esc(a.lot)}</text><text x="150" y="204" text-anchor="middle" class="d-petit">${a.ml} ml ℮</text>`;
    } else if (vue === 'dessus' || vue === 'tige') {
      scene = dessus(p, vue === 'tige');
    } else if (vue === 'boite') {
      scene = `<ellipse cx="146" cy="334" rx="78" ry="4" fill="${ENCRE}" opacity=".06"/>
        <path d="M80 92 L108 72 H226 L198 92 Z" ${TF('#ffffff')}/><path d="M198 92 L226 72 V310 L198 330 Z" ${TF('#ebebef')}/>
        <rect x="80" y="92" width="118" height="238" ${TF('#ffffff')}/>
        <line x1="100" x2="178" y1="160" y2="160" ${T}/><line x1="112" x2="166" y1="172" y2="172" ${T} opacity=".5"/>
        <text x="96" y="290" class="d-petit" text-anchor="start">${esc(a.lot)}</text>
        <g fill="${ENCRE}">${[0, 3, 5, 9, 11, 14, 17, 19, 22, 25, 27, 30].map((k) => `<rect x="${136 + k * 1.5}" y="296" width="${k % 3 ? 0.8 : 1.5}" height="20"/>`).join('')}</g>`;
    } else if (vue === 'ticket') {
      scene = `<path d="M96 66 H204 V314 l-9 -6 -9 6 -9 -6 -9 6 -9 -6 -9 6 -9 -6 -9 6 -9 -6 -9 6 -9 -6 -9 6 Z" ${TF('#ffffff')}/>
        ${[92, 104, 132, 144, 156, 168, 236].map((yy, i) => `<line x1="110" x2="${110 + [62, 84, 70, 48, 78, 60, 84][i]}" y1="${yy}" y2="${yy}" ${T} opacity="${i === 6 ? 1 : 0.5}"/>`).join('')}
        <text x="110" y="204" class="d-petit" text-anchor="start">${esc(p.nom).slice(0, 18)}</text>`;
    } else {
      scene = deFace();
      if (vue === 'niveau') {
        const f = FORMES[p.forme];
        const [, y, , h] = f.corps;
        const haut = y + 7;
        const bas = y + h - 6;
        const yy = 72 + 1.25 * (bas - (a.niveau / 100) * (bas - haut));
        scene += `<line x1="66" x2="232" y1="${yy}" y2="${yy}" ${T} stroke-dasharray="3 3"/><rect x="186" y="${yy - 24}" width="42" height="17" rx="8.5" fill="${ENCRE}"/><text x="207" y="${yy - 12}" text-anchor="middle" class="d-mesure">${a.niveau} %</text>`;
        vb = '62 142 176 220';
      }
      if (vue === 'preuve') {
        scene = `<g transform="translate(-46 16) scale(.9)">${scene}</g>
          <g transform="rotate(-4 214 270)"><rect x="162" y="228" width="108" height="80" ${TF('#ffffff')}/>
          <text x="174" y="260" class="d-note">@${esc(pseudo)}</text><text x="174" y="286" class="d-note">24/11/2026</text></g>`;
      }
    }
    return `<svg class="visuel ${classe}" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(`${p.nom}, ${LEGENDES[vue]}`)}"><rect x="-50" y="-50" width="400" height="475" fill="${FOND}"/>${scene}</svg>`;
  }

  /* un flacon seul, sans fond */
  const seul = (p, niveau = 80, classe = '', sansBouchon = false) => `<svg class="${classe}" viewBox="0 0 120 200" aria-hidden="true">${flacon(p, niveau, sansBouchon, ++uid)}</svg>`;

  /* le flacon qui vaporise, pour la porte « Vendre » : trait clair sur fond sombre, et la brume en points, comme dans
     le symbole du logo */
  const vaporise = (p) => {
    const id = ++uid;
    const f = FORMES[p.forme];
    const [cx, cy, cw] = f.col;
    const bx = cx + cw / 2 - 4.5;
    const by = cy - 12.5;
    const gouttes = [];
    for (let rang = 0; rang < 6; rang++) {
      for (let j = 0; j <= rang; j++) {
        const dx = -(16 + rang * 18);
        const dy = (j - rang / 2) * (6 + rang * 1.6);
        gouttes.push(`<circle cx="${bx}" cy="${by}" r="${(2.4 - rang * 0.28).toFixed(2)}" style="--dx:${dx}px;--dy:${dy.toFixed(1)}px;--d:${(rang * 0.12 + j * 0.05).toFixed(2)}s"/>`);
      }
    }
    return `<svg class="vaporise" viewBox="-130 0 250 200" aria-hidden="true"><g class="brume">${gouttes.join('')}</g><g class="trait-clair">${flacon(p, 70, true, id)}</g></svg>`;
  };

  return {photo, seul, vaporise, LEGENDES};
})();

/* Respray : le prototype. Une page, des vues appelées par l'adresse : #accueil, #recherche, #annonce-a101, #vendre,
   #fonctionnement, #panel. Rien n'est envoyé nulle part ; ce que fait l'équipe dans le panel est gardé dans ce
   navigateur. */
(() => {
  'use strict';

  /* ——— outils ——— */
  const P = Object.fromEntries(PARFUMS.map((p) => [p.id, p]));
  const A = Object.fromEntries(ANNONCES.map((a) => [a.id, a]));
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const nb = (n, d = 0) => n.toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});
  const eur = (n) => (Number.isInteger(n) ? nb(n) : nb(n, 2)) + ' €';
  const eur2 = (n) => nb(n, 2) + ' €';
  const nombre = (s) => parseFloat(String(s).replace(',', '.').replace(/\s/g, ''));
  const mlRestants = (a) => Math.round((a.ml * a.niveau) / 100);
  const prixMl = (a) => a.prix / mlRestants(a);
  const protection = (prix) => Math.round((prix * 0.05 + 0.7) * 100) / 100;
  const ENVOI = 4.9;
  const normal = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const cle = (s) => normal(s).replace(/[^a-z0-9]+/g, ' ').trim();
  const reduit = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const memoire = {
    lire(k, d) {
      try {
        return JSON.parse(localStorage.getItem('respray:' + k)) ?? d;
      } catch (e) {
        return d;
      }
    },
    ecrire(k, v) {
      try {
        localStorage.setItem('respray:' + k, JSON.stringify(v));
      } catch (e) {
        /* stockage indisponible : on garde en mémoire */
      }
    },
  };
  const favoris = new Set(memoire.lire('favoris', []));
  const etat = {
    maisonsAjoutees: memoire.lire('maisons', []),
    parfumsAjoutes: memoire.lire('parfums', []),
    propositions: memoire.lire('propositions', structuredClone(PROPOSITIONS_INITIALES)),
    aVerifier: memoire.lire('aVerifier', A_VERIFIER.map((a) => a.id)),
  };
  const sauver = () => {
